[project]
name = "python-drills"
version = "0.1.0"
description = "A week of Python drills before the Manifold build"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
